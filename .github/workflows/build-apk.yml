name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npx vite build

      - name: Copy Built Web Assets to Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Patch Capacitor Build Files for JDK 17
        run: |
          sed -i 's/8.13.0/8.2.2/g' node_modules/@capacitor/android/capacitor/build.gradle || true
          sed -i 's/VERSION_21/VERSION_17/g' node_modules/@capacitor/android/capacitor/build.gradle || true
          sed -i 's/compileSdkVersion : 36/compileSdkVersion : 34/g' node_modules/@capacitor/android/capacitor/build.gradle || true
          sed -i 's/targetSdkVersion : 36/targetSdkVersion : 34/g' node_modules/@capacitor/android/capacitor/build.gradle || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpensesTrackerPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
